name: Update Cursor agent

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Resolve and preview the Cursor update without opening a PR"
        required: false
        default: false
        type: boolean

concurrency:
  group: update-cursor-agent-upstream
  cancel-in-progress: true

permissions:
  contents: read

env:
  BASE_BRANCH: main
  CURSOR_INSTALL_URL: https://cursor.com/install
  FORK_REPOSITORY: iamanaws/registry
  UPSTREAM_REPOSITORY: agentclientprotocol/registry

jobs:
  update:
    if: github.repository == 'iamanaws/registry'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream base
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.BASE_BRANCH }}
          persist-credentials: false

      - name: Sync fork base
        if: inputs.dry_run != true
        env:
          PR_TOKEN: ${{ secrets.PR_TOKEN }}
        run: |
          set -euo pipefail

          git push "https://x-access-token:${PR_TOKEN}@github.com/${FORK_REPOSITORY}.git" "HEAD:${BASE_BRANCH}"

      - name: Update cursor/agent.json
        id: cursor
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail

          before_build="$(sed -nE 's|.*downloads\.cursor\.com/lab/([0-9]{4}\.[0-9]{2}\.[0-9]{2}-[a-f0-9]+)/.*|\1|p' cursor/agent.json | head -n1)"
          build="$(
            curl -fsSL "${CURSOR_INSTALL_URL}" |
              sed -nE '/^DOWNLOAD_URL=/s|^DOWNLOAD_URL="https://downloads\.cursor\.com/lab/([0-9]{4}\.[0-9]{2}\.[0-9]{2}-[a-f0-9]+)/.*|\1|p'
          )"
          if [ -z "${build}" ]; then
            echo "::error::Could not parse DOWNLOAD_URL from https://cursor.com/install"
            exit 1
          fi

          version="${build%%-*}"
          before_version="${before_build%%-*}"

          if [ -n "${before_build}" ] && [ "${before_version}" = "${version}" ]; then
            commit_message="cursor: ${before_build} -> ${build}"
          elif [ -n "${before_version}" ]; then
            commit_message="cursor: ${before_version} -> ${version}"
          else
            commit_message="cursor: ${version}"
          fi

          printf '%s\n' \
            "before_build=${before_build}" \
            "version=${version}" \
            "build=${build}" \
            "commit_message=${commit_message}" \
            "dry_run=${DRY_RUN}" \
            >> "${GITHUB_OUTPUT}"
          echo "Resolved Cursor build ${build} (version field ${version})"

          VERSION="${version}" BUILD="${build}" perl -0pi -e '
            s/"version": "[^"]+"/"version": "$ENV{VERSION}"/;
            s|lab/[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[a-f0-9]+/|lab/$ENV{BUILD}/|g;
          ' cursor/agent.json
          jq -e . cursor/agent.json >/dev/null

          if git diff --quiet -- cursor/agent.json; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "Cursor agent is already current."
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "Cursor agent build changed from ${before_build:-unknown} to ${build}."
            git diff -- cursor/agent.json
          fi

      - name: Check for existing Cursor PR
        id: existing_pr
        if: steps.cursor.outputs.changed == 'true' && steps.cursor.outputs.dry_run != 'true'
        env:
          PR_TOKEN: ${{ secrets.PR_TOKEN }}
        run: |
          set -euo pipefail

          existing_pr="$(
            curl -fsSL \
              -H "Authorization: Bearer ${PR_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${UPSTREAM_REPOSITORY}/pulls?state=open&base=${BASE_BRANCH}&per_page=100" |
              jq -c --arg fork_repo "${FORK_REPOSITORY}" '
                map(select(.head.repo.full_name == $fork_repo and (.head.ref | startswith("cursor-")))) |
                first // empty
              '
          )"

          if [ -n "${existing_pr}" ]; then
            echo "skip_create_pr=true" >> "${GITHUB_OUTPUT}"
            echo "pull_request_url=$(jq -r '.html_url' <<<"${existing_pr}")" >> "${GITHUB_OUTPUT}"
            echo "pull_request_number=$(jq -r '.number' <<<"${existing_pr}")" >> "${GITHUB_OUTPUT}"
            echo "head_ref=$(jq -r '.head.ref' <<<"${existing_pr}")" >> "${GITHUB_OUTPUT}"
            echo "Found existing open Cursor PR; skipping PR creation."
          else
            echo "skip_create_pr=false" >> "${GITHUB_OUTPUT}"
            echo "No existing open Cursor PR found."
          fi

      - name: Create pull request to upstream
        id: create_pr
        if: steps.cursor.outputs.changed == 'true' && steps.cursor.outputs.dry_run != 'true' && steps.existing_pr.outputs.skip_create_pr != 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.PR_TOKEN }}
          push-to-fork: ${{ env.FORK_REPOSITORY }}
          base: ${{ env.BASE_BRANCH }}
          commit-message: "${{ steps.cursor.outputs.commit_message }}"
          title: "${{ steps.cursor.outputs.commit_message }}"
          body: |
            Automated update using the build pinned by [cursor.com/install](${{ env.CURSOR_INSTALL_URL }}).

            - **Previous build:** `${{ steps.cursor.outputs.before_build }}`
            - **version:** `${{ steps.cursor.outputs.version }}`
            - **Build:** `${{ steps.cursor.outputs.build }}`

            **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: cursor-${{ steps.cursor.outputs.build }}
          delete-branch: true

      - name: Write workflow summary
        run: |
          set -euo pipefail

          pr_url="${{ steps.create_pr.outputs['pull-request-url'] || steps.existing_pr.outputs.pull_request_url }}"
          pr_num="${{ steps.create_pr.outputs['pull-request-number'] || steps.existing_pr.outputs.pull_request_number }}"
          if [ -n "${pr_url}" ] && [ -n "${pr_num}" ]; then
            echo "## Cursor update [#${pr_num}](${pr_url})" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "## Cursor update" >> "${GITHUB_STEP_SUMMARY}"
          fi
          echo >> "${GITHUB_STEP_SUMMARY}"

          if [ "${{ steps.existing_pr.outputs.skip_create_pr }}" = "true" ]; then
            echo "Reused existing open PR from branch \`${{ steps.existing_pr.outputs.head_ref }}\`." >> "${GITHUB_STEP_SUMMARY}"
            echo >> "${GITHUB_STEP_SUMMARY}"
          fi

          if [ "${{ steps.cursor.outputs.changed }}" = "true" ]; then
            {
              echo "### Diff"
              echo
              echo '```diff'
              git diff -- cursor/agent.json
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "No update is available." >> "${GITHUB_STEP_SUMMARY}"
          fi
