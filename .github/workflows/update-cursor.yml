name: Update Cursor agent

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Resolve and preview the Cursor update without opening a PR"
        required: false
        default: false
        type: boolean

concurrency:
  group: update-cursor-agent-upstream
  cancel-in-progress: true

permissions:
  contents: read

env:
  BASE_BRANCH: main
  CURSOR_INSTALL_URL: https://cursor.com/install
  FORK_REPOSITORY: iamanaws/registry
  UPSTREAM_REPOSITORY: agentclientprotocol/registry

jobs:
  update:
    if: github.repository == 'iamanaws/registry'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream base
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.BASE_BRANCH }}
          persist-credentials: false

      - name: Sync fork base
        if: inputs.dry_run != true
        env:
          PR_TOKEN: ${{ secrets.PR_TOKEN }}
        run: |
          set -euo pipefail

          # Reset the fork base branch to the checked-out upstream base.
          git push --force "https://x-access-token:${PR_TOKEN}@github.com/${FORK_REPOSITORY}.git" "HEAD:${BASE_BRANCH}"

      - name: Update cursor/agent.json
        id: cursor
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail

          before_build="$(sed -nE 's|.*downloads\.cursor\.com/lab/([0-9]{4}\.[0-9]{2}\.[0-9]{2}-[a-f0-9]+)/.*|\1|p' cursor/agent.json | head -n1)"
          build="$(
            curl -fsSL "${CURSOR_INSTALL_URL}" |
              sed -nE '/^DOWNLOAD_URL=/s|^DOWNLOAD_URL="https://downloads\.cursor\.com/lab/([0-9]{4}\.[0-9]{2}\.[0-9]{2}-[a-f0-9]+)/.*|\1|p'
          )"
          if [ -z "${build}" ]; then
            echo "::error::Could not parse DOWNLOAD_URL from https://cursor.com/install"
            exit 1
          fi

          version="${build%%-*}"
          before_version="${before_build%%-*}"

          if [ -n "${before_build}" ] && [ "${before_version}" = "${version}" ]; then
            commit_message="cursor: ${before_build} -> ${build}"
          elif [ -n "${before_version}" ]; then
            commit_message="cursor: ${before_version} -> ${version}"
          else
            commit_message="cursor: ${version}"
          fi

          printf '%s\n' \
            "before_build=${before_build}" \
            "version=${version}" \
            "build=${build}" \
            "commit_message=${commit_message}" \
            "dry_run=${DRY_RUN}" \
            >> "${GITHUB_OUTPUT}"
          echo "Resolved Cursor build ${build} (version field ${version})"

          VERSION="${version}" BUILD="${build}" perl -0pi -e '
            s/"version": "[^"]+"/"version": "$ENV{VERSION}"/;
            s|lab/[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[a-f0-9]+/|lab/$ENV{BUILD}/|g;
          ' cursor/agent.json
          jq -e . cursor/agent.json >/dev/null

          diff_file="${RUNNER_TEMP}/cursor-agent.diff"
          : > "${diff_file}"
          echo "diff_file=${diff_file}" >> "${GITHUB_OUTPUT}"

          if git diff --quiet -- cursor/agent.json; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "Cursor agent is already current."
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "Cursor agent build changed from ${before_build:-unknown} to ${build}."
            git diff -- cursor/agent.json | tee "${diff_file}"
          fi

      - name: Check for existing Cursor PR
        id: existing_pr
        if: steps.cursor.outputs.changed == 'true' && steps.cursor.outputs.dry_run != 'true'
        env:
          DESIRED_BUILD: ${{ steps.cursor.outputs.build }}
          DESIRED_VERSION: ${{ steps.cursor.outputs.version }}
          PR_TOKEN: ${{ secrets.PR_TOKEN }}
        run: |
          set -euo pipefail

          existing_pr="$(
            curl -fsSL \
              -H "Authorization: Bearer ${PR_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${UPSTREAM_REPOSITORY}/pulls?state=open&base=${BASE_BRANCH}&per_page=100" |
              jq -c --arg fork_repo "${FORK_REPOSITORY}" '
                map(select(.head.repo.full_name == $fork_repo and (.head.ref | startswith("cursor-")))) |
                first // empty
              '
          )"

          if [ -n "${existing_pr}" ]; then
            pr_url="$(jq -r '.html_url' <<<"${existing_pr}")"
            pr_number="$(jq -r '.number' <<<"${existing_pr}")"
            head_ref="$(jq -r '.head.ref' <<<"${existing_pr}")"
            encoded_head_ref="$(jq -rn --arg ref "${head_ref}" '$ref | @uri')"
            existing_agent_json="$(mktemp)"
            existing_build=""
            existing_version=""

            if curl -fsSL \
              -H "Authorization: Bearer ${PR_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${FORK_REPOSITORY}/contents/cursor/agent.json?ref=${encoded_head_ref}" |
              jq -r '.content' |
              base64 -d > "${existing_agent_json}"; then
              existing_version="$(jq -r '.version // empty' "${existing_agent_json}")"
              existing_build="$(sed -nE 's|.*downloads\.cursor\.com/lab/([0-9]{4}\.[0-9]{2}\.[0-9]{2}-[a-f0-9]+)/.*|\1|p' "${existing_agent_json}" | head -n1)"
            else
              echo "::warning::Could not read cursor/agent.json from existing PR branch ${head_ref}; falling back to the branch name."
            fi

            if [ -z "${existing_build}" ] && [[ "${head_ref}" == cursor-* ]]; then
              existing_build="${head_ref#cursor-}"
            fi
            if [ -z "${existing_version}" ] && [ -n "${existing_build}" ]; then
              existing_version="${existing_build%%-*}"
            fi

            echo "skip_create_pr=true" >> "${GITHUB_OUTPUT}"
            echo "pull_request_url=${pr_url}" >> "${GITHUB_OUTPUT}"
            echo "pull_request_number=${pr_number}" >> "${GITHUB_OUTPUT}"
            echo "head_ref=${head_ref}" >> "${GITHUB_OUTPUT}"
            echo "existing_build=${existing_build}" >> "${GITHUB_OUTPUT}"
            echo "existing_version=${existing_version}" >> "${GITHUB_OUTPUT}"

            if [ "${existing_build}" = "${DESIRED_BUILD}" ] && [ "${existing_version}" = "${DESIRED_VERSION}" ]; then
              echo "update_existing_pr=false" >> "${GITHUB_OUTPUT}"
              echo "Found existing open Cursor PR already targeting ${DESIRED_VERSION} (${DESIRED_BUILD})."
            else
              echo "update_existing_pr=true" >> "${GITHUB_OUTPUT}"
              echo "Found existing open Cursor PR targeting ${existing_version:-unknown} (${existing_build:-unknown}); will update it to ${DESIRED_VERSION} (${DESIRED_BUILD})."
            fi
          else
            echo "skip_create_pr=false" >> "${GITHUB_OUTPUT}"
            echo "update_existing_pr=false" >> "${GITHUB_OUTPUT}"
            echo "No existing open Cursor PR found."
          fi

      - name: Update existing Cursor PR
        if: steps.cursor.outputs.changed == 'true' && steps.cursor.outputs.dry_run != 'true' && steps.existing_pr.outputs.update_existing_pr == 'true'
        env:
          BEFORE_BUILD: ${{ steps.cursor.outputs.before_build }}
          BUILD: ${{ steps.cursor.outputs.build }}
          COMMIT_MESSAGE: ${{ steps.cursor.outputs.commit_message }}
          EXISTING_BUILD: ${{ steps.existing_pr.outputs.existing_build }}
          EXISTING_VERSION: ${{ steps.existing_pr.outputs.existing_version }}
          HEAD_REF: ${{ steps.existing_pr.outputs.head_ref }}
          PR_NUMBER: ${{ steps.existing_pr.outputs.pull_request_number }}
          PR_TOKEN: ${{ secrets.PR_TOKEN }}
          VERSION: ${{ steps.cursor.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cursor/agent.json
          git commit -m "${COMMIT_MESSAGE}"
          git push --force "https://x-access-token:${PR_TOKEN}@github.com/${FORK_REPOSITORY}.git" "HEAD:${HEAD_REF}"

          curl -fsSL \
            -X PATCH \
            -H "Authorization: Bearer ${PR_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${UPSTREAM_REPOSITORY}/pulls/${PR_NUMBER}" \
            -d "$(jq -n --arg title "${COMMIT_MESSAGE}" '{title: $title}')"

          comment_body="$(mktemp)"
          cat > "${comment_body}" <<EOF
          Updated this PR to the latest build pinned by [cursor.com/install](${CURSOR_INSTALL_URL}).

          - **Previous upstream build:** \`${BEFORE_BUILD:-unknown}\`
          - **Previous PR build:** \`${EXISTING_BUILD:-unknown}\`
          - **Previous PR version:** \`${EXISTING_VERSION:-unknown}\`
          - **version:** \`${VERSION}\`
          - **Build:** \`${BUILD}\`

          **Workflow run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer ${PR_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${UPSTREAM_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -d "$(jq -n --rawfile body "${comment_body}" '{body: $body}')"

      - name: Create pull request to upstream
        id: create_pr
        if: steps.cursor.outputs.changed == 'true' && steps.cursor.outputs.dry_run != 'true' && steps.existing_pr.outputs.skip_create_pr != 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.PR_TOKEN }}
          push-to-fork: ${{ env.FORK_REPOSITORY }}
          base: ${{ env.BASE_BRANCH }}
          commit-message: "${{ steps.cursor.outputs.commit_message }}"
          title: "${{ steps.cursor.outputs.commit_message }}"
          body: |
            Automated update using the build pinned by [cursor.com/install](${{ env.CURSOR_INSTALL_URL }}).

            - **Previous build:** `${{ steps.cursor.outputs.before_build }}`
            - **version:** `${{ steps.cursor.outputs.version }}`
            - **Build:** `${{ steps.cursor.outputs.build }}`

            **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: cursor-${{ steps.cursor.outputs.build }}
          delete-branch: true

      - name: Write workflow summary
        run: |
          set -euo pipefail

          pr_url="${{ steps.create_pr.outputs['pull-request-url'] || steps.existing_pr.outputs.pull_request_url }}"
          pr_num="${{ steps.create_pr.outputs['pull-request-number'] || steps.existing_pr.outputs.pull_request_number }}"
          if [ -n "${pr_url}" ] && [ -n "${pr_num}" ]; then
            echo "## Cursor update [#${pr_num}](${pr_url})" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "## Cursor update" >> "${GITHUB_STEP_SUMMARY}"
          fi
          echo >> "${GITHUB_STEP_SUMMARY}"

          if [ "${{ steps.existing_pr.outputs.skip_create_pr }}" = "true" ] && [ "${{ steps.existing_pr.outputs.update_existing_pr }}" = "true" ]; then
            echo "Updated existing open PR branch \`${{ steps.existing_pr.outputs.head_ref }}\` from \`${{ steps.existing_pr.outputs.existing_build || 'unknown' }}\` to \`${{ steps.cursor.outputs.build }}\`." >> "${GITHUB_STEP_SUMMARY}"
            echo >> "${GITHUB_STEP_SUMMARY}"
          elif [ "${{ steps.existing_pr.outputs.skip_create_pr }}" = "true" ]; then
            echo "Existing open PR branch \`${{ steps.existing_pr.outputs.head_ref }}\` already targets \`${{ steps.cursor.outputs.build }}\`." >> "${GITHUB_STEP_SUMMARY}"
            echo >> "${GITHUB_STEP_SUMMARY}"
          fi

          if [ "${{ steps.cursor.outputs.changed }}" = "true" ]; then
            {
              echo "### Diff"
              echo
              echo '```diff'
              sed -n '1,200p' "${{ steps.cursor.outputs.diff_file }}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "No update is available." >> "${GITHUB_STEP_SUMMARY}"
          fi
